# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    ingestion.france_travail.token_url: '%env(FT_TOKEN_URL)%'
    ingestion.france_travail.client_id: '%env(FT_CLIENT_ID)%'
    ingestion.france_travail.client_secret: '%env(FT_CLIENT_SECRET)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # one resource block per bounded context (screaming architecture: context
    # is the PSR-4 root, see the php-ddd-clean-architecture skill). src/App/
    # holds only the Kernel and is intentionally not autowired as a service.
    Ingestion\:
        resource: '../src/Ingestion/'

    Ingestion\Infrastructure\FranceTravail\OAuth2AccessTokenProvider:
        arguments:
            $tokenUrl: '%ingestion.france_travail.token_url%'
            $clientId: '%ingestion.france_travail.client_id%'
            $clientSecret: '%ingestion.france_travail.client_secret%'

    Ingestion\Infrastructure\FranceTravail\AccessTokenProvider:
        alias: Ingestion\Infrastructure\FranceTravail\OAuth2AccessTokenProvider

    Catalog\:
        resource: '../src/Catalog/'

    Search\:
        resource: '../src/Search/'

    CandidateProfile\:
        resource: '../src/CandidateProfile/'

    Matching\:
        resource: '../src/Matching/'

    Shared\:
        resource: '../src/Shared/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
