framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        # failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            # failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'
            scheduler_ingestion: 'schedule://ingestion'
            # Search indexing is a genuinely async concern (embedding is a
            # slow external API call that must never block Job publishing
            # or expiry) - a dedicated broker rather than reusing Postgres
            # as a queue.
            async: '%env(MESSENGER_TRANSPORT_DSN)%'

        routing:
            'Shared\IntegrationEvent\JobWasChanged': async

