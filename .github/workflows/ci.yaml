---
name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker images
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      - name: Start services
        run: docker compose up --wait --no-build
      - name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost
      # Uncomment when the homepage is configured, or change the path to check
      # - name: Check HTTPS reachability
      #   run: curl -v --insecure --fail-with-body https://localhost
      - name: Check Mercure reachability
        run: curl -vI --insecure --fail-with-body https://localhost/.well-known/mercure?topic=test
      - name: Create test database
        run: docker compose exec -T php bin/console -e test doctrine:database:create
      - name: Run migrations
        run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction
      - name: Run PHPUnit
        run: docker compose exec -T php bin/phpunit
      - name: Doctrine Schema Validator
        run: docker compose exec -T php bin/console -e test doctrine:schema:validate
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker images
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      - name: Start services
        run: docker compose up --wait --no-build php
      - name: PHPStan
        run: docker compose exec -T php php -d memory_limit=1G vendor/bin/phpstan analyse --configuration=phpstan.dist.neon --memory-limit=1G --no-progress
      - name: PHP-CS-Fixer
        run: docker compose exec -T php vendor/bin/php-cs-fixer fix --dry-run --diff --no-interaction
      - name: deptrac
        run: docker compose exec -T php vendor/bin/deptrac analyse --config-file=deptrac.php --no-interaction
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint Code Base
        uses: super-linter/super-linter/slim@v8
        env:
          GITHUB_ACTIONS_CONFIG_FILE: actionlint.yaml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_CHECKOV: false
          VALIDATE_TRIVY: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          # PHP is already covered by the static-analysis job (phpstan,
          # cs-fixer, deptrac) against our actual Docker image/PHP version.
          # super-linter's own composer install uses its bundled PHP 8.4
          # runtime, which is missing ext-xml and doesn't satisfy this
          # project's >=8.5.8 requirement - that's an environment mismatch
          # in the linter container, not a real problem with the project.
          VALIDATE_PHP_BUILTIN: false
          VALIDATE_PHP_PHPCS: false
          VALIDATE_PHP_PHPSTAN: false
          VALIDATE_PHP_PSALM: false
          # Pedantic prose-style terminology rule (git -> Git, id -> ID);
          # doesn't fit this project's docs/skill-file writing conventions
          # and flags no real defect.
          VALIDATE_NATURAL_LANGUAGE: false
          # dotenv-linter only flags alphabetical key ordering here, which
          # would break the deliberate logical grouping in api/.env (token
          # URL, then the credentials that fetch it, then search filters).
          VALIDATE_ENV: false
          # Recipe/scaffold territory we don't hand-format: symfony-docker's
          # own bundled docs and entrypoint script, devcontainer config, the
          # Flex-generated api/config/packages|routes files (services.yaml
          # is our own and stays linted), the vendor phpstorm-meta stub, and
          # the web/ SPA scaffold (frontend work hasn't started - see
          # CLAUDE.md build phases).
          FILTER_REGEX_EXCLUDE: "api/docs/|api/frankenphp/|\\.devcontainer/|api/config/reference\\.php|api/config/packages/|api/config/routes|api/phpunit\\.dist\\.xml|compose\\.override\\.yaml|compose\\.prod\\.yaml|web/"
